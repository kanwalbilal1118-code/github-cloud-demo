
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Cloud Demo</title>

  <style>
    body {
      margin: 0;
      padding: 60px 20px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #0d1117;
      color: #f0f6fc;
    }

    .card {
      max-width: 650px;
      margin: 30px auto;
      padding: 30px;
      border: 1px solid #30363d;
      border-radius: 16px;
      background: #161b22;
    }

    h1 {
      color: #3fb950;
    }

    .label {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #203d2a;
      color: #7ee787;
    }
  </style>
</head>

<body>
  <h1>Version 2 — Website Updated on GitHub!</h1>

  <p class="label">Hosted with GitHub Pages</p>

  <div class="card">
    <h2>GitHub Cloud Services</h2>
    <p>This website is stored in a GitHub repository.</p>
    <p>GitHub Pages makes this website available online.</p>
    <p>Our group successfully published and updated this website online.</p>
  </div>
</body>
</html>
